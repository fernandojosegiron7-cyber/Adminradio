<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d0f"><title>Radio sin conexión</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080a12;color:#f7f8ff;font:16px system-ui,sans-serif}.box{max-width:520px;text-align:center;padding:34px;border:1px solid #2c3340;border-radius:24px;background:#111424}.dot{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;border:3px solid #d9a441;display:grid;place-items:center;font-size:30px}h1{margin:0 0 10px;font-family:Georgia,serif}p{color:#aeb4c7;line-height:1.5}button{margin-top:12px;padding:11px 18px;border:0;border-radius:12px;background:#d9a441;color:#111;font-weight:700}</style></head><body><main class="box"><div class="dot">♪</div><h1>Sin conexión</h1><p>La aplicación está instalada, pero necesitas internet para escuchar la transmisión en vivo.</p><button onclick="location.reload()">Intentar de nuevo</button></main></body></html>
